name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) Check the app before anything is published: text rules, then the real app on an emulator.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Text rule tests
        run: |
          chmod +x gradlew
          ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screen tests on an emulator
        id: screens
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDirectDebugAndroidTest -PallAbis --stacktrace

      # The emulator download or start sometimes fails on the build machine: try once more.
      - name: Screen tests on an emulator (second attempt)
        if: steps.screens.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDirectDebugAndroidTest -PallAbis --stacktrace

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports
          if-no-files-found: ignore

  # 2) Only when the tests pass: build and publish.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repository secrets, never in the code.
      - name: Prepare signing key
        id: signing
        env:
          # The intended names first; the others cover likely typos made when the secrets were added.
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE || secrets.SIGHNING_KEYSTONE || secrets.SIGNING_KEYSTONE || secrets.SIGHNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD || secrets.SIGHNING_PASSWORD || secrets.SIGNING_PASSWORLD || secrets.SIGNING_PASWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \n\r' | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=tiho\nkeyPassword=%s\n' \
              "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleDirectRelease --stacktrace
            cp app/build/outputs/apk/direct/release/app-direct-release.apk Tiho.apk
            # Installed apps read this file to learn that a newer build exists.
            echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.6.${{ github.run_number }}\"}" > version.json
          else
            # No signing key yet: a test build that cannot update an installed app.
            # Also compile the release variant, so problems show up before the key is added.
            ./gradlew assembleDirectDebug assembleDirectRelease --stacktrace
            cp app/build/outputs/apk/direct/debug/app-direct-debug.apk Tiho.apk
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          FILES="Tiho.apk"
          if [ -f version.json ]; then FILES="Tiho.apk version.json"; fi
          gh release create "v1.6.${{ github.run_number }}" $FILES \
            --title "Tiho 1.6.${{ github.run_number }}" \
            --notes "Download Tiho.apk and open it on the phone." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
