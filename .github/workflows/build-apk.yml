name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repository secrets, never in the code.
      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \n\r' | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=tiho\nkeyPassword=%s\n' \
              "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleDirectRelease --stacktrace
            cp app/build/outputs/apk/direct/release/app-direct-release.apk Tiho.apk
            # Installed apps read this file to learn that a newer build exists.
            echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.3.${{ github.run_number }}\"}" > version.json
          else
            # No signing key yet: a test build that cannot update an installed app.
            # Also compile the release variant, so problems show up before the key is added.
            ./gradlew assembleDirectDebug assembleDirectRelease --stacktrace
            cp app/build/outputs/apk/direct/debug/app-direct-debug.apk Tiho.apk
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          FILES="Tiho.apk"
          if [ -f version.json ]; then FILES="Tiho.apk version.json"; fi
          gh release create "v1.3.${{ github.run_number }}" $FILES \
            --title "Tiho 1.3.${{ github.run_number }}" \
            --notes "Download Tiho.apk and open it on the phone. Installed copies update themselves." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
