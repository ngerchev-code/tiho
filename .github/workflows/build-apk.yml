name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Tiho-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tiho.apk
          gh release create "v1.0.${{ github.run_number }}" Tiho.apk \
            --title "Tiho build ${{ github.run_number }}" \
            --notes "Test build (debug). Download Tiho.apk and open it on the phone." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
